<style>
#customCartModal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #f7f7f7;
    z-index: 999999;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-y: auto;
    overflow-x: hidden;
}
#customCartHeader {
    background: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #eaeaea;
}
#customCartHeader h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    flex-grow: 1;
    text-align: center;
    padding-right: 40px; 
}
#customCartEmpty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px 40px;
    text-align: center;
    background: #f7f7f7;
}
#customCartEmpty svg {
    width: 64px;
    height: 64px;
    color: #d1d5db;
    margin-bottom: 20px;
}
#customCartEmpty h2 {
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 8px 0;
    color: #111;
}
#customCartEmpty p {
    font-size: 14px;
    color: #6b7280;
    margin: 0 0 24px 0;
    line-height: 1.4;
}
#customCartBtn {
    background: #FE2C55;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    max-width: 240px;
}
#customCartRecommendations {
    padding: 0 16px 40px;
    background: #f7f7f7;
}
#customCartRecommendations h3 {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 16px 0;
    color: #111;
}
.cart-rec-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
.cart-rec-card {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    text-decoration: none;
    display: flex;
    flex-direction: column;
}
.cart-rec-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: #f3f4f6;
}
.cart-rec-info {
    padding: 8px;
}
.cart-rec-title {
    font-size: 12px;
    color: #4b5563;
    margin: 0 0 4px 0;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.cart-rec-price {
    font-size: 14px;
    font-weight: 700;
    color: #111;
    margin: 0;
}
</style>

<div id="customCartModal">
    <div id="customCartHeader">
        <button onclick="window.closeCustomCart()" style="border:none;background:transparent;cursor:pointer;padding:8px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <h1>Carrinho (0)</h1>
    </div>

    <div id="customCartEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="2"></circle>
            <circle cx="20" cy="21" r="2"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            <path d="M14 3l1 2 2 1-2 1-1 2-1-2-2-1 2-1z" fill="#d1d5db" stroke="none"></path>
            <circle cx="18" cy="4" r="1" fill="#d1d5db" stroke="none"></circle>
        </svg>
        <h2>Seu carrinho está vazio</h2>
        <p>Vamos enchê-lo com seus achados favoritos e ótimas ofertas!</p>
        <button id="customCartBtn" onclick="window.closeCustomCart(); window.location.href='/loja.html'">Começar a comprar</button>
    </div>

    <div id="customCartRecommendations">
        <h3>Você também pode gostar</h3>
        <div class="cart-rec-grid" id="cartRecGrid">
            <!-- Dynamic products will be injected here -->
        </div>
    </div>
</div>

<script>
window.openCustomCart = function() {
    document.getElementById('customCartModal').style.display = 'flex';
    window.renderCartRecommendations();
};

window.closeCustomCart = function() {
    document.getElementById('customCartModal').style.display = 'none';
};

window.renderCartRecommendations = function() {
    const grid = document.getElementById('cartRecGrid');
    if (!grid) return;
    grid.innerHTML = '';
    
    let products = window.ShopConfig ? window.ShopConfig.store_products : [];
    if (!products || products.length === 0) return;

    let shuffled = [...products].sort(() => 0.5 - Math.random()).slice(0, 4);

    shuffled.forEach(product => {
        let link = document.createElement('a');
        link.href = 'produto-' + product.id + '.html';
        link.className = 'cart-rec-card';

        let html = 
            '<img src="' + (product.image || '') + '" class="cart-rec-img" alt="">' +
            '<div class="cart-rec-info">' +
                '<p class="cart-rec-title">' + (product.title || product.name) + '</p>' +
                '<p class="cart-rec-price">R$ ' + (product.price || product.discount_price || '0,00') + '</p>' +
            '</div>';
        
        link.innerHTML = html;
        grid.appendChild(link);
    });
};

document.addEventListener('click', function(e) {
    const cartLink = e.target.closest('a[href="pagamento.html"], a[href="/pagamento"]');
    const btn = e.target.closest('button');
    const isCartSvgBtn = btn && btn.innerHTML.includes('circle cx="9" cy="21"');
    
        
    const isAddToCartBtn = btn && btn.textContent && btn.textContent.toLowerCase().includes('adicionar');

    if (!isAddToCartBtn && (cartLink || isCartSvgBtn)) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        window.openCustomCart();
    }
}, true);

    // Loja Estrela Badge Injection
    const badgeObserver = new MutationObserver(() => {
        const h1 = document.querySelector('h1.text-\\[15\\.5px\\]');
        if (h1 && !h1.querySelector('.loja-estrela-badge')) {
            const badge = document.createElement('span');
            badge.className = 'loja-estrela-badge';
            badge.style.cssText = 'background: #ffe3c2; color: #111; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-right: 6px; vertical-align: text-bottom; display: inline-block;';
            badge.textContent = 'Loja Estrela';
            h1.insertBefore(badge, h1.firstChild);
        }
    });
    badgeObserver.observe(document.body, { childList: true, subtree: true });
</script>
