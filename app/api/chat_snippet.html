<div id="customChatModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; flex-direction:column; justify-content:flex-end;">
    <div style="background:white; height:90%; width:100%; max-width:480px; margin:0 auto; border-top-left-radius:16px; border-top-right-radius:16px; display:flex; flex-direction:column; overflow:hidden;">
        <!-- Header -->
        <div style="display:flex; align-items:center; gap:12px; padding:16px; border-bottom:1px solid #f0f0f0;">
            <button onclick="window.closeCustomChat()" style="border:none; background:transparent; font-size:24px; cursor:pointer;">&larr;</button>
            <div style="font-weight:bold; font-size:18px; flex-grow:1;" id="customChatStoreName">Loja</div>
        </div>
        
        <!-- Messages Area -->
        <div id="customChatMessages" style="flex-grow:1; padding:16px; background:#f9f9f9; overflow-y:auto; display:flex; flex-direction:column; gap:12px;">
            <!-- Initial Chatbot message -->
            <div style="display:flex; justify-content:flex-start;">
                <div style="max-width:85%; background:white; padding:12px; border-radius:12px; border-bottom-left-radius:0; box-shadow:0 1px 2px rgba(0,0,0,0.05); font-size:14px; border:1px solid #eee;">
                    Agradecemos por entrar em contato. Como posso ajudar hoje?
                </div>
            </div>
            
            <!-- Chatbot Options -->
            <div id="customChatOptions" style="display:flex; justify-content:flex-start; margin-top:-4px;">
                <div style="width:100%; max-width:85%; background:white; border-radius:12px; box-shadow:0 1px 2px rgba(0,0,0,0.05); border:1px solid #eee; overflow:hidden;">
                    <div style="padding:12px; font-weight:bold; font-size:14px; border-bottom:1px solid #f0f0f0;">
                        Como posso ajudar você hoje?
                    </div>
                    <div onclick="window.sendCustomChat('Você tem esse produto em estoque?')" style="padding:12px; font-size:14px; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; cursor:pointer;">
                        <span>Você tem esse produto em estoque?</span><span>&rsaquo;</span>
                    </div>
                    <div onclick="window.sendCustomChat('Estou tentando comprar')" style="padding:12px; font-size:14px; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; cursor:pointer;">
                        <span>Estou tentando comprar</span><span>&rsaquo;</span>
                    </div>
                    <div onclick="window.sendCustomChat('Já paguei')" style="padding:12px; font-size:14px; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; cursor:pointer;">
                        <span>Já paguei</span><span>&rsaquo;</span>
                    </div>
                    <div onclick="window.sendCustomChat('Como faço para usar?')" style="padding:12px; font-size:14px; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; cursor:pointer;">
                        <span>Como faço para usar?</span><span>&rsaquo;</span>
                    </div>
                    <div onclick="window.sendCustomChat('O que está incluído no produto?')" style="padding:12px; font-size:14px; display:flex; justify-content:space-between; cursor:pointer;">
                        <span>O que está incluído no produto?</span><span>&rsaquo;</span>
                    </div>
                </div>
            </div>
            <div style="font-size:11px; color:#999; margin-left:12px;">Enviado por chatbot</div>
        </div>
        
        <!-- Input Area -->
        <div style="padding:12px; background:white; border-top:1px solid #f0f0f0; display:flex; gap:8px;">
            <input type="text" id="customChatInput" placeholder="Enviar mensagem..." style="flex-grow:1; background:#f5f5f5; border:none; padding:12px 16px; border-radius:20px; outline:none; font-size:14px;">
            <button onclick="window.submitCustomChat()" style="border:none; background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</div>
<script>
window.chatSessionId = localStorage.getItem('chatSessionId');
if (!window.chatSessionId) {
    window.chatSessionId = Math.random().toString(36).substr(2, 9);
    localStorage.setItem('chatSessionId', window.chatSessionId);
}

window.openCustomChat = function() {
    document.getElementById('customChatModal').style.display = 'flex';
    if (window.ShopConfig && window.ShopConfig.store_name) {
        document.getElementById('customChatStoreName').innerText = window.ShopConfig.store_name;
    }
    window.pollCustomChat();
    window.chatInterval = setInterval(window.pollCustomChat, 3000);
};

// Intercept Chat Button Click
document.addEventListener('click', function(e) {
    const chatBtn = e.target.closest('button[aria-label="Chat"]');
    const isMensagemBtn = e.target.tagName === 'BUTTON' && e.target.innerText.trim() === 'Mensagem';
    
    if (chatBtn || isMensagemBtn) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        window.openCustomChat();
    }
}, true);

window.closeCustomChat = function() {
    document.getElementById('customChatModal').style.display = 'none';
    if (window.chatInterval) clearInterval(window.chatInterval);
};

window.sendCustomChat = function(text) {
    if (!text) return;
    document.getElementById('customChatOptions').style.display = 'none';
    
    // Add to UI
    const msgs = document.getElementById('customChatMessages');
    const el = document.createElement('div');
    el.style.display = 'flex';
    el.style.justifyContent = 'flex-end';
    el.innerHTML = '<div style="max-width:85%; background:#ff2e5a; color:white; padding:12px; border-radius:12px; border-bottom-right-radius:0; font-size:14px;">' + text + '</div>';
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
    
    fetch('/api/chat.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ session_id: window.chatSessionId, message: text, sender: 'customer' })
    });
};

window.submitCustomChat = function() {
    const input = document.getElementById('customChatInput');
    const text = input.value.trim();
    if (text) {
        window.sendCustomChat(text);
        input.value = '';
    }
};

document.getElementById('customChatInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        window.submitCustomChat();
    }
});

let lastMessageCount = 0;
window.pollCustomChat = function() {
    fetch('/api/chat.php?action=get_messages&session_id=' + window.chatSessionId)
        .then(r => r.json())
        .then(data => {
            if (data.messages && data.messages.length > lastMessageCount) {
                const msgs = document.getElementById('customChatMessages');
                // Remove everything except the first two chatbot nodes to rebuild from DB
                // For simplicity, just rebuild all after chatbot node if we had complex state
                // But it's easier to just add new messages that we haven't seen.
                for (let i = lastMessageCount; i < data.messages.length; i++) {
                    const m = data.messages[i];
                    if (document.getElementById('customChatOptions')) {
                        document.getElementById('customChatOptions').style.display = 'none';
                    }
                    const el = document.createElement('div');
                    el.style.display = 'flex';
                    if (m.sender === 'admin') {
                        el.style.justifyContent = 'flex-start';
                        el.innerHTML = '<div style="max-width:85%; background:white; padding:12px; border-radius:12px; border-bottom-left-radius:0; font-size:14px; border:1px solid #eee;">' + m.message + '</div>';
                    } else {
                        // Avoid duplicating optimistic messages - for a real app we need a better sync, but here we just rebuild if needed
                        // Actually, since we optimistically added it, we should just rebuild the whole list to be safe.
                    }
                }
                
                // Better approach: rebuild all user/admin messages
                const container = document.getElementById('customChatMessages');
                // Keep the first 3 children (welcome message, options, "Enviado por chatbot")
                while (container.children.length > 3) {
                    container.removeChild(container.lastChild);
                }
                
                if (data.messages.length > 0 && document.getElementById('customChatOptions')) {
                    document.getElementById('customChatOptions').style.display = 'none';
                }
                
                data.messages.forEach(m => {
                    const el = document.createElement('div');
                    el.style.display = 'flex';
                    if (m.sender === 'admin') {
                        el.style.justifyContent = 'flex-start';
                        el.innerHTML = '<div style="max-width:85%; background:white; padding:12px; border-radius:12px; border-bottom-left-radius:0; font-size:14px; border:1px solid #eee;">' + m.message + '</div>';
                    } else {
                        el.style.justifyContent = 'flex-end';
                        el.innerHTML = '<div style="max-width:85%; background:#ff2e5a; color:white; padding:12px; border-radius:12px; border-bottom-right-radius:0; font-size:14px;">' + m.message + '</div>';
                    }
                    container.appendChild(el);
                });
                container.scrollTop = container.scrollHeight;
                
                lastMessageCount = data.messages.length;
            }
        });
};
</script>
